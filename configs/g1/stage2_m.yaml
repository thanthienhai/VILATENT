# G1, stage 2, ViLatent-M (W0 memory only) at 4×, from the 4× stage-1 writer (O-LM).
# The checkpoint is chosen by dev loss (CE + λ·KL) on ViQuAD dev, never on test.
reader: Qwen/Qwen3.5-2B
reader_config: configs/readers/qwen3.5-2b.json
task: qa
mode: M
train: data/tasks/viquad_train_clean.jsonl
dev: data/tasks/viquad_dev.jsonl
teacher_train: data/teacher/qwen3.5-2b/viquad_train.pt
teacher_dev: data/teacher/qwen3.5-2b/viquad_dev.pt
init_from: runs/g1_stage1_r4/best.pt
out_dir: runs/g1_stage2_m_r4
ratio: 4
n_layers: 4
lora_rank: 0
chunk_tokens: 512
lambda_kl: 1.0
lr_adapter: 1.0e-4
lr_writer: 2.0e-5
weight_decay: 0.0
max_grad_norm: 1.0
warmup_frac: 0.03
steps: 2000
effective_batch: 32
micro_batch: 8
eval_every: 250
log_every: 10
seed: 0
