# G1, stage 2, control "learned prompt + BM25" (review of 22/10/2026): mode ME at a 4× budget, but the
# memory is a table of learned vectors that ignores the context (vilatent.writer.PromptWriter), trained
# from scratch on the same data, loss and BM25 sentences as ME. ME minus this control is what the memory
# content adds beyond the answer style (a G1 condition).
# scripts/run_g1.sh sets memory_factor to f* (chosen on the select dev loss) and runs lr_adapter 1e-4 and
# 1e-3, keeping the lower select dev loss (scripts/choose_by_loss.py); the values below are overridden.
reader: Qwen/Qwen3.5-2B
reader_config: configs/readers/qwen3.5-2b.json
task: qa
mode: ME
writer: prompt
memory_factor: 2
train: data/tasks/viquad_train_clean.jsonl
dev: data/tasks/viquad_select.jsonl
teacher_train: data/teacher/qwen3.5-2b/viquad_train.pt
teacher_dev: data/teacher/qwen3.5-2b/viquad_select.pt
out_dir: runs/g1_stage2_prompt_r4
ratio: 4
chunk_tokens: 512
lambda_kl: 1.0
lr_adapter: 1.0e-4
weight_decay: 0.0
max_grad_norm: 1.0
warmup_frac: 0.03
steps: 2000
effective_batch: 32
micro_batch: 32  # effective_batch 32 in one pass: peak ~10.5 GB at 8 on H100 (smoke 22/10/2026)
eval_every: 250
log_every: 10
seed: 0
