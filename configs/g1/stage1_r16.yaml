# G1, stage 1 (O-LM, shortened), writer at 16×: used by ViLatent-ME f = 4 at a 4× budget.
# docs/VILATENT.md §Cổng quyết định: 2,000–3,000 steps before the ViQuAD fine-tuning.
reader: Qwen/Qwen3.5-2B
reader_config: configs/readers/qwen3.5-2b.json
task: continue
mode: M
train: data/stage1/pairs_train.jsonl
dev: data/stage1/pairs_dev.jsonl
teacher_train: data/teacher/qwen3.5-2b/pairs_train.pt
teacher_dev: data/teacher/qwen3.5-2b/pairs_dev.pt
out_dir: runs/g1_stage1_r16
ratio: 16
n_layers: 4
lora_rank: 0
chunk_tokens: 512
lambda_kl: 1.0
lr_adapter: 1.0e-4
lr_writer: 2.0e-5
weight_decay: 0.0
max_grad_norm: 1.0
warmup_frac: 0.03
steps: 2500
effective_batch: 32
micro_batch: 32  # effective_batch 32 in one pass: peak ~10.5 GB at 8 on H100 (smoke 22/10/2026)
eval_every: 250
log_every: 10
seed: 0
