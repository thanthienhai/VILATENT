# Paper, stage 2, frozen-writer baseline, LatentPress-style (checklist A23, B13): the copied L = 4 layers
# stay frozen; only the adapter (identity at the start), the scale s and the boundary embeddings are
# trained, on stage 2 only (no stage 1), with the same sampling, data and steps as stage2_mem. L = 2 as in
# LatentPress would hold only Gated DeltaNet layers of Qwen3.5 (no attention).
reader: Qwen/Qwen3.5-2B
reader_config: configs/readers/qwen3.5-2b.json
task: qa
train: data/tasks/viquad_train_clean.jsonl
train_multi: data/tasks/viquad_train_multi.jsonl
dev: data/tasks/viquad_select.jsonl
dev_multi: data/tasks/viquad_select_multi.jsonl
teacher_train: data/teacher/qwen3.5-2b/viquad_train.pt
teacher_train_multi: data/teacher/qwen3.5-2b/viquad_train_multi.pt
teacher_dev: data/teacher/qwen3.5-2b/viquad_select.pt
teacher_dev_multi: data/teacher/qwen3.5-2b/viquad_select_multi.pt
multi_share: 0.3
freeze_writer: true
out_dir: runs/paper/stage2_frozen
ratios: [4, 8, 16]
memory_factors: [1, 2, 4, 8]
max_pool: 32
n_layers: 4
lora_rank: 0
chunk_tokens: 512
lambda_kl: 1.0
lr_adapter: 1.0e-4
weight_decay: 0.0
max_grad_norm: 1.0
warmup_frac: 0.03
steps: 4000
effective_batch: 32
micro_batch: 32
eval_every: 250
log_every: 10
seed: 0
